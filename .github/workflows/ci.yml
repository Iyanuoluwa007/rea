name: Rizin fixture macOS verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rizin-fixture-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: "0"
  NODE_OPTIONS: --max-old-space-size=1536

jobs:
  rizin-fixtures:
    name: Native macOS fixture lifetime
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Record host and toolchain
        run: |
          node -e 'console.log(JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version })); if (process.platform !== "darwin") process.exit(1);'
          npm --version
          sw_vers -productVersion
      - uses: ./.github/actions/npm-cache
      - run: npm ci
      - run: npm run build:cached
      - name: Prepare a fresh proof report
        run: |
          mkdir -p .cache
          rm -f .cache/rizin-native-proof.json
      - name: Run real fixture processes and lifecycle boundaries
        run: >-
          npx vitest run --coverage.enabled=false --maxWorkers=2
          --reporter=json --outputFile=.cache/rizin-native-proof.json
          tests/boundary/providers/RizinDebugSessionCoverage.part1.test.ts
          tests/boundary/providers/RizinDebugSessionCoverage.part2.test.ts
          tests/boundary/providers/RizinDebugSessionCoverage.part3.test.ts
          tests/boundary/providers/RizinDebugSessionCoverage.part4.test.ts
          tests/boundary/process/providerProcess.test.ts
          tests/boundary/process/providerProcessOutput.test.ts
          src/process/ProviderProcessOutput.test.ts
      - name: Require complete native proof and identical source
        run: |
          node --input-type=module - <<'JS'
          import { readFile } from "node:fs/promises";
          import { execFileSync } from "node:child_process";
          const source = "5d85cfe4ebab0e91b04e6e9d7dadf72738c45677";
          const changed = execFileSync("git", ["diff", "--name-only", source, "HEAD"], { encoding: "utf8" }).trim();
          if (changed !== ".github/workflows/ci.yml") throw new Error("Diagnostic source differs from the PR candidate");
          execFileSync("git", ["diff", "--exit-code", "HEAD", "--"]);
          const result = JSON.parse(await readFile(".cache/rizin-native-proof.json", "utf8"));
          if (process.platform !== "darwin" || !Array.isArray(result.testResults) || result.testResults.length !== 7 || result.numPassedTests !== 88 || result.numFailedTests !== 0 || result.numPendingTests !== 0)
            throw new Error("Missing or incomplete native fixture verification");
          console.log(JSON.stringify({ source_revision: source, platform: process.platform, architecture: process.arch, node: process.version, files: result.testResults.length, passed: result.numPassedTests, skipped: result.numPendingTests }));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rizin-native-macos-proof
          path: .cache/rizin-native-proof.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
